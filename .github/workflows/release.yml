# Builds signed per-ABI APKs (x86_64, armeabi-v7a, arm64-v8a).
# - Push a tag like v1.2.0: builds and publishes a GitHub Release with the APKs attached.
# - Run manually (workflow_dispatch): builds and uploads the APKs as a workflow artifact only.
#
# Required repository secrets:
#   SUBMARK_KEYSTORE_BASE64   base64 of the release .jks
#   SUBMARK_KEYSTORE_PASSWORD
#   SUBMARK_KEY_ALIAS
#   SUBMARK_KEY_PASSWORD
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Resolve version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            name="${GITHUB_REF_NAME#v}"
          else
            name="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          # Monotonic across runs so every published APK can update the previous one.
          code=$((GITHUB_RUN_NUMBER + 1))
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Building $name ($code)"

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SUBMARK_KEYSTORE_BASE64 }}
        run: |
          # Never publish debug-signed APKs: users could not update them later.
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::Secret SUBMARK_KEYSTORE_BASE64 is not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "SUBMARK_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APKs
        env:
          SUBMARK_KEYSTORE_PASSWORD: ${{ secrets.SUBMARK_KEYSTORE_PASSWORD }}
          SUBMARK_KEY_ALIAS: ${{ secrets.SUBMARK_KEY_ALIAS }}
          SUBMARK_KEY_PASSWORD: ${{ secrets.SUBMARK_KEY_PASSWORD }}
        run: >
          ./gradlew :app:assembleRelease
          -PversionName=${{ steps.version.outputs.name }}
          -PversionCode=${{ steps.version.outputs.code }}

      - name: Collect APKs
        run: |
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "app/build/outputs/apk/release/app-$abi-release.apk" \
              "dist/SubMark-${{ steps.version.outputs.name }}-$abi.apk"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -l dist

      - name: Upload artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: SubMark-${{ steps.version.outputs.name }}
          path: dist/
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
